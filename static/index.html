<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Offline Response Collector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div class="header-text">
        <p class="eyebrow" aria-hidden="true">Prompt</p>
        <h1 class="title">Who is Jesus?</h1>
      </div>
      <img src="/static/mn_logo.png" alt="Make New logo" class="brand-mark" />
    </header>

    <section class="hero" aria-labelledby="cloud-label">
      <h2 id="cloud-label" class="visually-hidden">Live word cloud</h2>
      <div class="hero-card">
        <div class="hero-media">
          <img id="cloud" src="/wordcloud.png" alt="Live word cloud" />
        </div>
      </div>
    </section>

    <section class="composer" aria-labelledby="response-label">
      <h2 id="response-label" class="visually-hidden">Submit a response</h2>
      <form id="response-form" class="response-form" autocomplete="off">
        <label class="visually-hidden" for="response-input">Response</label>
        <input
          id="response-input"
          name="body"
          class="input"
          type="text"
          placeholder="Share a thought…"
          required
          minlength="1"
          maxlength="120"
          inputmode="text"
          enterkeyhint="send"
          autocomplete="off"
        />
        <span id="char-counter" class="hint" aria-live="polite">0/120</span>
        <button type="submit" class="btn">Submit</button>
      </form>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
